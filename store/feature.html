<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Display"; src: url("display.ttf"); }
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
  body {
    position: relative; color: #F2F7FC; font-family: "Display", Georgia, serif;
    background:
      radial-gradient(46% 70% at 26% 62%, rgba(255, 223, 164, 0.38), rgba(246, 178, 92, 0) 62%),
      linear-gradient(180deg, rgba(4,32,63,0) 56%, rgba(4,32,63,.62) 80%, rgba(4,32,63,.9) 100%),
      linear-gradient(180deg, #2E86DC 0%, #0F5AA8 48%, #062E5E 100%);
  }
  .courses { position: absolute; inset: 0; opacity: 0.08;
    background-image: repeating-linear-gradient(180deg, rgba(220,235,251,0.9) 0 1px, transparent 1px 62px); }
  .mote { position: absolute; border-radius: 50%; background: #FFF1D6; }
  svg.mark { position: absolute; left: 78px; top: 46px; width: 408px; height: 408px; }
  .copy { position: absolute; left: 508px; top: 152px; width: 470px; }
  h1 { margin: 0; font-size: 122px; line-height: 1; letter-spacing: -0.035em; font-weight: 700;
       text-shadow: 0 8px 34px rgba(3, 32, 63, 0.55); }
  p { margin: 22px 0 0 5px; font-size: 30px; line-height: 1.28; color: #FFDFA4; max-width: 450px; }
  .rule { position: absolute; left: 512px; top: 132px; width: 78px; height: 5px; border-radius: 3px;
          background: linear-gradient(90deg, #FFF7E7, #F3A945); }
</style>
</head>
<body>
  <div class="courses"></div>
  <div class="mote" style="left:640px;top:74px;width:5px;height:5px;opacity:.55"></div>
  <div class="mote" style="left:868px;top:118px;width:4px;height:4px;opacity:.45"></div>
  <div class="mote" style="left:754px;top:52px;width:3px;height:3px;opacity:.4"></div>
  <div class="mote" style="left:120px;top:66px;width:4px;height:4px;opacity:.4"></div>

  <svg class="mark" viewBox="18 18 72 72" aria-hidden="true">
    <defs>
      <linearGradient id="opening" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FFF7E7"/><stop offset="0.52" stop-color="#FFD79A"/>
        <stop offset="1" stop-color="#F3A945"/>
      </linearGradient>
      <linearGradient id="spill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#FFF3D8" stop-opacity="0.98"/>
        <stop offset="0.55" stop-color="#FFD79A" stop-opacity="0.7"/>
        <stop offset="1" stop-color="#F6B25C" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#8FB6DE"/><stop offset="1" stop-color="#D7E7F7"/>
      </linearGradient>
      <linearGradient id="sill" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#BFDCF6"/><stop offset="0.5" stop-color="#FFFFFF"/>
        <stop offset="1" stop-color="#BFDCF6"/>
      </linearGradient>
      <filter id="cast" filterUnits="userSpaceOnUse" x="0" y="0" width="108" height="108">
        <feGaussianBlur in="SourceAlpha" stdDeviation="2.1"/><feOffset dy="2.6" result="o"/>
        <feFlood flood-color="#03203F" flood-opacity="0.55"/><feComposite in2="o" operator="in"/>
        <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="bloom" filterUnits="userSpaceOnUse" x="0" y="0" width="108" height="108">
        <feGaussianBlur stdDeviation="3.6"/>
      </filter>
    </defs>
    <path d="M43 71 H73 L90 92 H26 Z" fill="url(#spill)" filter="url(#bloom)"/>
    <path d="M44 72 H72 L84 86 H32 Z" fill="url(#spill)" opacity="0.9"/>
    <rect x="44" y="27" width="28" height="45" rx="1.5" fill="url(#opening)" filter="url(#cast)"/>
    <rect x="44" y="27" width="28" height="45" rx="1.5" fill="none" stroke="#FFF8EC" stroke-width="1.1" opacity="0.85"/>
    <path d="M44 27 L33 33 V78 L44 72 Z" fill="url(#leaf)" stroke="#0B3A6B" stroke-width="1.6"
          stroke-linejoin="round" filter="url(#cast)"/>
    <path d="M36.6 51.5 v6" stroke="#0B3A6B" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
    <rect x="38" y="70.5" width="40" height="3.4" rx="1.7" fill="url(#sill)"/>
  </svg>

  <div class="rule"></div>
  <div class="copy">
    <h1>Doorway</h1>
    <p>Every place you go, and whether you can get in.</p>
  </div>
</body>
</html>
